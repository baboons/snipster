[package]
name = "snipster-core"
version = "0.1.0"
edition = "2021"
description = "Pixel pipeline for Snipster: parallel PNG encoding, blur/pixelate, scroll stitching"
publish = false

[lib]
name = "snipster_core"
crate-type = ["staticlib", "rlib"]

[dependencies]
crc32fast = "1.4"
flate2 = { version = "1.1", default-features = false, features = ["zlib-rs"] }
rayon = "1.10"
simd-adler32 = "0.3"

[dev-dependencies]
png = "0.18"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
# Unwinding across the C ABI into Swift is undefined behaviour; abort instead.
panic = "abort"
debug = false

[profile.bench]
inherits = "release"
